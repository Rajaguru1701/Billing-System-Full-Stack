<div class="form-container">
  <form [formGroup]="customerForm" (ngSubmit)="onSubmit()">

    <div class="brand-section">
      <h2>New Customer<br>Profile</h2>
      <p>Fill out the fields to add a client entry to the database context layer.</p>

      <div *ngIf="successMessage || errorMessage"
        [ngClass]="{'status-success': successMessage, 'status-error': errorMessage}" class="inline-accent-bar">
        <span class="pulse-indicator"></span>
        <p class="status-text">{{ successMessage || errorMessage }}</p>
      </div>
    </div>

    <div class="fields-section">
      <div class="form-group">
        <label>Name</label>
        <input formControlName="name" placeholder="Enter full name" />
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input formControlName="phoneNo" placeholder="Enter contact number" />
      </div>

      <div class="form-group">
        <label>Address</label>
        <textarea formControlName="address" placeholder="Enter physical street location"></textarea>
      </div>

      <button type="submit" [disabled]="customerForm.invalid" class="btn-submit">Submit Details</button>
    </div>

  </form>
</div>
